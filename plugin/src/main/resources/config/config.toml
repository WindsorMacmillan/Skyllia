# Version of the configuration file. Do not edit manually.
config-version = 4
# Enables detailed logging in the console (for debugging purposes).
verbose = false

[settings.restore]
# 本服务端项目自定义修改：岛屿存档恢复（热回档）所用的备份世界目录。
# 指向"备份中的世界根目录"——即该目录下应有 dimensions/<命名空间>/<维度>/region|poi|entities。
# 支持绝对路径；相对路径相对于服务端工作目录。
# 例：你的全量备份世界文件夹为 E:\Minecraft Luminol Server\restore\world，则填该路径。
backup-root = "restore/world"
# 定时提醒在线管理员备份世界存档的间隔（小时）。0 表示关闭提醒。
reminder-interval-hours = 2

[settings.island]
# Distance between islands (in regions, 1 region = 512x512 blocks).
region-distance = 10
# Maximum number of islands that can be created on the server.
max-islands = 500_000
# If a player finds himself outside his island (e.g. by falling into the void),
# he will be automatically teleported to his island only if his Y position
# is above the minimum layer of the world.
teleport-outside-island = false
# Prevents players from walking outside their island boundaries.
# If enabled, players trying to move beyond their island will be gently teleported back.
restrict-player-movement = false
# Allows players to right-click obsidian with a bucket to get a lava bucket.
# When enabled, the obsidian block is consumed and replaced with a lava bucket.
# This mechanic is useful in Skyblock for renewable lava generation.
enable-obsidian-to-lava-conversion = true

[settings.island.delete]
# Prevents deletion of an island if it contains other members.
prevent-deletion-if-has-members = true
# Determines the method of deleting an island:
# — False: Deletes the entire island region, safer, but very costly in performance.
# — True: only delete chunks around the island according to its actual size (faster but potentially less clean).
chunk-perimeter-island = false

[settings.island.chunk-processing.delete]
# Number of threads for the island deletion scheduler.
# -1 = auto: max(4, cpu_cores / 8). Minimum is always 4.
threads = -1
# Delay in milliseconds between each chunk deletion.
# Increase to reduce CPU/RAM spikes. 50ms = 1 chunk per tick.
delay-ms = 50

[settings.island.chunk-processing.biome]
# Number of threads for the biome change scheduler.
# -1 = auto: max(4, cpu_cores / 8). Minimum is always 4.
threads = -1
# Delay in milliseconds between each biome chunk operation.
delay-ms = 50

[settings.island.invitation]
# Automatically teleports the player to the island when accepting an invitation.
teleport-when-accepting = true

[settings.island.queue]
# Allows players with the permission "skyllia.island.bypass.queue" to bypass the island creation queue.
# If set to false, everyone must wait in the queue regardless of permissions.
allow-bypass = true
# Maximum number of islands the server will create concurrently (players beyond
# this limit wait in the queue, same as before).
# -1 = auto: derived from available CPU cores, capped at 4 so the default SQLite
#      backend (max 4 pooled connections, see database.toml) is never asked for
#      more concurrent writes than it can serve. 1 = strictly sequential, the
#      previous behavior.
# Only the schematic paste, teleport and world-border steps actually run in
# parallel: the single database write that claims a region for a new island is
# always serialized internally, so raising this value cannot cause two islands
# to be assigned overlapping regions. If you run MariaDB/PostgreSQL with a
# larger connection pool and want more throughput during creation spikes
# (season launch, server opening), raise this explicitly past 4.
max-concurrent = -1

[settings.spawn]
# Enables the global spawn point (access via /spawn).
enable = true
# World name for spawn.
world-name = "world"
# Spawn point coordinates (X, Y, Z) and orientation (Yaw, Pitch).
block-x = 0.0
block-y = 0.0
block-z = 0.0
yaw = 0.0
pitch = 0.0

[debug]
# Enables permissions debug mode: displays missing permissions in the console
# when a player attempts an action without permission (useful for administrators).
permission = false

[settings.cache.ttl]
# Duration (in seconds) before cached warp data expires. -1 = never expires, 0 = disabled.
warps = -1
# Duration (in seconds) before cached member name→role mappings expire. -1 = never expires, 0 = disabled.
name-role = -1
# Duration (in seconds) before cached player role data expires. -1 = never expires, 0 = disabled.
role = -1
# Duration (in seconds) before cached island data expires. -1 = never expires, 0 = disabled.
island = -1
# Duration (in seconds) before cached player↔island link data expires. -1 = never expires, 0 = disabled.
player-link = -1
# Duration (in seconds) before cached island members and ban list expire. -1 = never expires, 0 = disabled.
members = -1
# Duration (in seconds) before cached island state expires (disabled, private, locked, max members, size). -1 = never expires, 0 = disabled.
state = -1
# Duration (in seconds) before cached island name expires. -1 = never expires, 0 = disabled.
island-name = -1
# Duration (in seconds) before cached island description expires. -1 = never expires, 0 = disabled.
island-description = -1

[settings.update-checker]
# Enables automatic update checking from Modrinth.
enabled = true
# Interval between checks, in minutes. Default: 60 (every hour).
interval-minutes = 60

[permissions]
# Enabling the owner check also allows you to verify if the OWNER has permission (useful if you want OWNERS to not have access to everything).
check-owner = false
# Enables ban checking: if true, banned players will be denied access to island actions.
check-ban = false